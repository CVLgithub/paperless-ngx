<!doctype html>

{% load static i18n %}

<html lang="en" data-bs-theme="auto">
<head>
	<meta charset="utf-8">
	<title>Paperless</title>
	<base href="{% url 'base' %}">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="#fefefe" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)">
	<meta name="cookie_prefix" content="{{cookie_prefix}}">
	<meta name="robots" content="noindex,nofollow">
	<meta name="author" content="The Paperless-ngx Team">
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='64' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%231885f8'/%3E%3Cstop offset='52%25' stop-color='%230671e3'/%3E%3Cstop offset='100%25' stop-color='%23055ec2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='.5' y='.5' width='63' height='63' rx='15.5' fill='none' stroke='%23fff' stroke-opacity='.2'/%3E%3Cpath d='M20 12h16l12 12v24a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3Cpath d='M36 12v8.5a3.5 3.5 0 0 0 3.5 3.5H48L36 12z' fill='%230671e3' fill-opacity='.28'/%3E%3Crect x='22' y='28' width='20' height='3.4' rx='1.7' fill='%230671e3'/%3E%3Crect x='22' y='36' width='20' height='3.4' rx='1.7' fill='%230671e3'/%3E%3Crect x='22' y='44' width='13' height='3.4' rx='1.7' fill='%230671e3'/%3E%3C/svg%3E">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link rel="manifest" href="{% static webmanifest %}" crossorigin="use-credentials">
	<link rel="stylesheet" href="{% static styles_css %}">
	<link rel="apple-touch-icon" href="{% static apple_touch_icon %}">
</head>
<body>
	<pngx-root>
		<script type="text/javascript">
			setTimeout(() => {
				let warning = document.getElementsByClassName('warning').item(0)
				if (warning) {
					warning.classList.remove('hide')
					warning.classList.add('show')
				}
			}, 8000)
		</script>
		<style type="text/css">
			:root {
				--rd-splash-bg: #fefefe;
				--rd-splash-subtle: #f2f2f5;
				--rd-splash-text: #1c1c1e;
				--rd-splash-secondary: #68686e;
				--rd-splash-border: rgba(17, 17, 20, 0.08);
				--rd-splash-track: rgba(17, 17, 20, 0.08);
				--rd-splash-accent: #0671e3;
				--rd-splash-accent-hover: #0560c4;
				--rd-splash-glow: rgba(6, 113, 227, 0.06);
				--rd-splash-emblem-shadow: 0 10px 26px rgba(6, 113, 227, 0.26), 0 2px 6px rgba(6, 113, 227, 0.16);
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--rd-splash-bg: #151517;
					--rd-splash-subtle: #222226;
					--rd-splash-text: #f5f5f7;
					--rd-splash-secondary: #a1a1a8;
					--rd-splash-border: rgba(255, 255, 255, 0.08);
					--rd-splash-track: rgba(255, 255, 255, 0.1);
					--rd-splash-accent: #1076eb;
					--rd-splash-accent-hover: #2d8af5;
					--rd-splash-glow: rgba(16, 118, 235, 0.11);
					--rd-splash-emblem-shadow: 0 12px 30px rgba(0, 0, 0, 0.45), 0 2px 10px rgba(16, 118, 235, 0.25);
				}
			}

			html, body {
				width: 100%;
				min-height: 100%;
				margin: 0;
				padding: 0;
				background-color: var(--rd-splash-bg);
				color: var(--rd-splash-text);
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}

			.rd-splash {
				min-height: 100vh;
				width: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				box-sizing: border-box;
				background: radial-gradient(ellipse 68% 48% at 50% 0%, var(--rd-splash-glow), transparent 72%), var(--rd-splash-bg);
			}

			.rd-splash__inner {
				display: flex;
				flex-direction: column;
				align-items: center;
				text-align: center;
				width: 100%;
				max-width: 340px;
			}

			.rd-splash__emblem {
				width: 56px;
				height: 56px;
				border-radius: 16px;
				display: flex;
				align-items: center;
				justify-content: center;
				background: linear-gradient(180deg, #1885f8 0%, #0671e3 52%, #055ec2 100%);
				box-shadow: var(--rd-splash-emblem-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.28);
			}

			.rd-splash__wordmark {
				margin: 16px 0 0;
				font-size: 1.375rem;
				font-weight: 700;
				letter-spacing: -0.025em;
				line-height: 1.2;
				color: var(--rd-splash-text);
			}

			.rd-splash__track {
				margin-top: 22px;
				width: 140px;
				height: 4px;
				border-radius: 9999px;
				background: var(--rd-splash-track);
				overflow: hidden;
				position: relative;
			}

			.rd-splash__bar {
				position: absolute;
				top: 0;
				left: 0;
				width: 44%;
				height: 100%;
				border-radius: 9999px;
				background: var(--rd-splash-accent);
				animation: rd-splash-slide 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
				will-change: transform;
			}

			@keyframes rd-splash-slide {
				0% {
					transform: translateX(-110%);
				}
				100% {
					transform: translateX(250%);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.rd-splash__bar {
					position: static;
					width: 52%;
					margin: 0 auto;
					animation: none;
					opacity: 0.8;
				}
			}

			.rd-splash__status {
				margin: 14px 0 0;
				font-size: 0.8125rem;
				font-weight: 500;
				line-height: 1.4;
				color: var(--rd-splash-secondary);
			}

			.rd-splash__warning {
				margin: 22px 0 0;
				padding: 12px 16px;
				border-radius: 12px;
				background: var(--rd-splash-subtle);
				border: 1px solid var(--rd-splash-border);
				font-size: 0.78125rem;
				line-height: 1.45;
				color: var(--rd-splash-secondary);
				opacity: 0;
				transform: translateY(4px);
				pointer-events: none;
				transition: opacity 0.35s ease, transform 0.35s ease;
			}

			.rd-splash__warning.show {
				opacity: 1;
				transform: translateY(0);
				pointer-events: auto;
			}

			.rd-splash__warning a {
				color: var(--rd-splash-accent);
				text-decoration: none;
				font-weight: 500;
			}

			.rd-splash__warning a:hover {
				color: var(--rd-splash-accent-hover);
				text-decoration: underline;
			}
		</style>
		<div class="rd-splash" role="status" aria-live="polite">
			<div class="rd-splash__inner">
				<div class="rd-splash__emblem" aria-hidden="true">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="28" height="34" fill="none">
						<path d="M5 2h15l11 11v26a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3z" fill="#ffffff"/>
						<path d="M20 2v8a3 3 0 0 0 3 3h8L20 2z" fill="#0671e3" fill-opacity="0.28"/>
						<rect x="8" y="18" width="17" height="3" rx="1.5" fill="#0671e3"/>
						<rect x="8" y="25" width="17" height="3" rx="1.5" fill="#0671e3"/>
						<rect x="8" y="32" width="11" height="3" rx="1.5" fill="#0671e3"/>
					</svg>
				</div>
				<div class="rd-splash__wordmark">Paperless</div>
				<div class="rd-splash__track" aria-hidden="true">
					<div class="rd-splash__bar"></div>
				</div>
				<p class="rd-splash__status">{% translate "Paperless-ngx is loading..." %}</p>
				<p class="rd-splash__warning warning hide">{% translate "Still here?! Hmm, something might be wrong." %} <a href="https://docs.paperless-ngx.com">{% translate "Here's a link to the docs." %}</a></p>
			</div>
		</div>
		<script type="text/javascript">{# Pass Django messages to Angular frontend #}
			window.DJANGO_MESSAGES = [
				{% for message in messages %}
					{ level: "{{ message.level_tag | escapejs }}", message: "{{ message | escapejs }}" },
				{% endfor %}
			]
		</script>
	</pngx-root>
	<script src="{% static polyfills_js %}" type="module"></script>
	<script src="{% static main_js %}" type="module"></script>
</body>
</html>
