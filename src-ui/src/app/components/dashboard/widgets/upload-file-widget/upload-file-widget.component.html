<pngx-widget-frame *pngxIfPermissions="{ action: PermissionAction.Add, type: PermissionType.Document }" [cardless]="true">
  <div content tourAnchor="tour.upload-widget">
    <form class="rd-upload-form">
      <button type="button" class="rd-upload-card-btn" (click)="fileUpload.click()">
        <span class="rd-upload-icon-circle" aria-hidden="true">
          <pngx-bs-icon name="upload" width="1.1rem" height="1.1rem"></pngx-bs-icon>
        </span>
        <span class="rd-upload-title" i18n>Upload documents</span>
        <span class="rd-upload-subtitle" i18n>or drop files anywhere</span>
      </button>
      <input type="file" class="visually-hidden" (change)="onFileSelected($event)" multiple #fileUpload>
    </form>
  </div>
</pngx-widget-frame>
