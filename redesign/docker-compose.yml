name: paperless-redesign

services:
  broker:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperless} -d ${POSTGRES_DB:-paperless}"]
      interval: 10s
      timeout: 5s
      retries: 5

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REDESIGN_HOST_PORT:-8090}:8000"
      - "100.120.88.96:${REDESIGN_HOST_PORT:-8090}:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
      - ../src/documents/static/frontend:/usr/src/paperless/static/frontend:ro
      - ../src/documents/templates/index.html:/usr/src/paperless/src/documents/templates/index.html:ro
      - ../src/documents/templates/paperless-ngx/base.html:/usr/src/paperless/src/documents/templates/paperless-ngx/base.html:ro
      - ../src/paperless/static/paperless/img/favicon.ico:/usr/src/paperless/src/paperless/static/paperless/img/favicon.ico:ro
    env_file:
      - .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: ${POSTGRES_DB:-paperless}
      PAPERLESS_DBUSER: ${POSTGRES_USER:-paperless}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

  ui-builder:
    image: docker.io/library/node:24-trixie-slim
    profiles:
      - build
    working_dir: /workspace/src-ui
    volumes:
      - ..:/workspace
      - pnpm_store:/root/.local/share/pnpm/store
      - ui_node_modules:/workspace/src-ui/node_modules
    environment:
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NODE_OPTIONS: "--max-old-space-size=4096"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        corepack enable && corepack prepare pnpm@latest --activate
        pnpm install --frozen-lockfile
        pnpm exec ng build --configuration redesign || exit 1
        # Precompress text assets (.br + .gz siblings) so WhiteNoise serves them
        # directly instead of compressing on the fly. Idempotent: rewrites
        # existing siblings and removes orphaned/obsolete ones.
        node -e '
        const fs = require("fs"), path = require("path"), zlib = require("zlib");
        const root = "/workspace/src/documents/static/frontend";
        const exts = new Set([".js", ".mjs", ".css", ".html", ".svg", ".json", ".webmanifest", ".txt", ".wasm"]);
        const MIN = 1024;
        let count = 0, before = 0, after = 0;
        const put = (file, data, size) => {
          if (data.length < size * 0.95) fs.writeFileSync(file, data);
          else fs.rmSync(file, { force: true });
        };
        const walk = (dir) => {
          for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
            const p = path.join(dir, e.name);
            if (e.isDirectory()) { walk(p); continue; }
            const ext = path.extname(e.name);
            if (ext === ".br" || ext === ".gz") {
              const src = p.slice(0, -ext.length);
              if (exts.has(path.extname(src)) && !fs.existsSync(src)) fs.rmSync(p, { force: true });
              continue;
            }
            if (!exts.has(ext)) continue;
            const buf = fs.readFileSync(p);
            if (buf.length < MIN) {
              fs.rmSync(p + ".br", { force: true });
              fs.rmSync(p + ".gz", { force: true });
              continue;
            }
            const br = zlib.brotliCompressSync(buf, { params: {
              [zlib.constants.BROTLI_PARAM_MODE]: zlib.constants.BROTLI_MODE_TEXT,
              [zlib.constants.BROTLI_PARAM_QUALITY]: zlib.constants.BROTLI_MAX_QUALITY,
              [zlib.constants.BROTLI_PARAM_SIZE_HINT]: buf.length,
            } });
            put(p + ".br", br, buf.length);
            put(p + ".gz", zlib.gzipSync(buf, { level: 9 }), buf.length);
            count++; before += buf.length; after += br.length;
          }
        };
        walk(root);
        console.log("precompressed " + count + " files: " + (before / 1048576).toFixed(1) + " MB -> " + (after / 1048576).toFixed(1) + " MB (brotli)");
        '

volumes:
  data:
  media:
  export:
  consume:
  pgdata:
  redisdata:
  pnpm_store:
  ui_node_modules:
